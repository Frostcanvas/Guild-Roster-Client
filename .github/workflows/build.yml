name: Build Guild Roster Client

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/GuildRoster.Client/GuildRoster.Client.csproj

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/GuildRoster.Client/GuildRoster.Client.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/win-x64

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "publish/win-x64/GuildRosterClient.exe"
          if (-not (Test-Path $exe)) {
            throw "GuildRosterClient.exe was not produced."
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Read client version
        id: version
        shell: pwsh
        run: |
          $project = [xml](Get-Content "src/GuildRoster.Client/GuildRoster.Client.csproj")
          $version = [string]$project.Project.PropertyGroup.Version
          $fileVersion = [string]$project.Project.PropertyGroup.FileVersion
          if ([string]::IsNullOrWhiteSpace($version) -or [string]::IsNullOrWhiteSpace($fileVersion)) {
            throw "Could not read Guild Roster Client version metadata."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }

          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "/DMyAppFileVersion=${{ steps.version.outputs.file_version }}" "installer\GuildRosterClient.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $setup = "publish/installer/GuildRosterClient-Setup.exe"
          if (-not (Test-Path $setup)) {
            throw "GuildRosterClient-Setup.exe was not produced."
          }

          Get-Item $setup | Format-List Name,Length,LastWriteTime
          Get-FileHash $setup -Algorithm SHA256 | Format-List

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuildRosterClient-Setup-${{ steps.version.outputs.version }}
          path: publish/installer/GuildRosterClient-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release client v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "client-v$version"
          $asset = "publish/installer/GuildRosterClient-Setup.exe"
          $prerelease = $version.Contains("-")
          $notes = @"
          FrostLabs Guild Roster Client $version

          Public GitHub release for the standalone FrostLabs Guild Roster Client. Beta 4 and later query this repository's Releases API directly for automatic updates. The installer verifies its GitHub-provided SHA-256 digest and expected size before execution.
          "@
          Set-Content -Path "release-notes.tmp.md" -Value $notes -Encoding UTF8

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Bump the client version instead of replacing an existing release."
          }

          if ($prerelease) {
            gh release create $tag --target $env:GITHUB_SHA --title "Guild Roster Client v$version" --notes-file "release-notes.tmp.md" --prerelease $asset
          }
          else {
            gh release create $tag --target $env:GITHUB_SHA --title "Guild Roster Client v$version" --notes-file "release-notes.tmp.md" $asset
          }
